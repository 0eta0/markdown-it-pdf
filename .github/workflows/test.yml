name: test-ci
on:
  push:
    branches-ignore:
      - "main"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "26.7"
      - uses: flatt-security/setup-takumi-guard-npm@v1
      - name: install
        run: npm ci
      - name: test
        run: npm test
